syntax = "proto3";

package todennus.proto.service;

option go_package = "github.com/todennus/proto/gen/service";

import "dto/file.proto";

service File {
    rpc RegisterUpload(dto.FileRegisterUploadRequest) returns (dto.FileRegisterUploadResponse) {}
    rpc CreatePresignedURL(dto.FileCreatePresignedURLRequest) returns (dto.FileCreatePresignedURLResponse) {}
    rpc ChangeRefcount(dto.FileChangeRefcountRequest) returns (dto.FileChangeRefcountResponse) {}
}
